<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {{content-for "head"}}

    <link rel="manifest" href="{{rootURL}}manifest.webmanifest">
    <meta name="msapplication-config" content="{{rootURL}}browserconfig.xml">
    <link rel="ard" href="/.well-known/ard.json" type="application/json">

    <link rel="stylesheet" href="{{rootURL}}assets/itworksbetter.css">

    <link rel="mask-icon" href="/apple-touch-icon.svg" color="#59d33c">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
    <meta name="msapplication-TileColor" content="#59d33c">

    <link rel="preload" as="image" href="/assets/images/index-background.webp" >

    <script type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "Person",
        "name": "Kamil Wyremski",
        "url": "https://wyremski.pl/en",
        "image": "",
        "sameAs": [
          "https://linkedin.com/in/kamil-wyremski",
          "https://github.com/kamilwyremski"
        ],
        "jobTitle": "Full Stack Web Developer"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "Organization",
        "@id": "https://itworksbetter.net/#organization",
        "name": "IT Works Better",
        "url": "https://itworksbetter.net/",
        "logo": "https://itworksbetter.net/assets/icons/icon-512x512.png",
        "description": "Full-stack web development agency offering custom websites, web and mobile applications, graphic design, SEO services, and pre-made website scripts.",
        "email": "info@itworksbetter.net",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "email": "info@itworksbetter.net",
          "url": "https://itworksbetter.net/contact"
        },
        "sameAs": [
          "https://linkedin.com/in/kamil-wyremski",
          "https://github.com/kamilwyremski"
        ],
        "founder": {
          "@type": "Person",
          "name": "Kamil Wyremski",
          "url": "https://wyremski.pl/en"
        },
        "knowsAbout": [
          "Web Development",
          "Full Stack Development",
          "SEO",
          "Graphic Design",
          "Symfony",
          "Laravel",
          "React",
          "Angular",
          "Vue",
          "Ember"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Web Development Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Website Script",
                "description": "Ready-made website scripts for classifieds, real estate, job boards, and more"
              },
              "description": "From 240 EUR. Current script prices are listed in the online shop.",
              "url": "https://sklep.itworksbetter.net/",
              "priceCurrency": "EUR",
              "priceSpecification": {
                "@type": "PriceSpecification",
                "minPrice": 240,
                "priceCurrency": "EUR"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Company Website",
                "description": "WordPress-based company websites"
              },
              "description": "Indicative price range: 200-600 EUR. All prices are negotiable.",
              "priceCurrency": "EUR",
              "priceSpecification": {
                "@type": "PriceSpecification",
                "minPrice": 200,
                "maxPrice": 600,
                "priceCurrency": "EUR"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Individual Web Application",
                "description": "Custom backend and frontend web applications"
              },
              "description": "From 1000 EUR. Final price depends on project scope and is negotiable.",
              "priceCurrency": "EUR",
              "priceSpecification": {
                "@type": "PriceSpecification",
                "minPrice": 1000,
                "priceCurrency": "EUR"
              }
            }
          ]
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "WebSite",
        "name": "IT Works Better",
        "url": "https://itworksbetter.net/",
        "description": "Full-stack web development agency offering custom websites, web and mobile applications, graphic design, SEO services, and pre-made website scripts."
      }
    </script>

    {{content-for "head-footer"}}
  </head>
  <body>
    {{content-for "body"}}

    <script src="{{rootURL}}assets/vendor.js"></script>
    <script src="{{rootURL}}assets/itworksbetter.js"></script>

    {{content-for "body-footer"}}
  </body>
</html>
